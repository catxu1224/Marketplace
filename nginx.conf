server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    location / { try_files $uri $uri/ =404; }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
